<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 146" width="720" height="146" role="img" aria-label="find-files: decision cost and latency per backend (FAKE)">
<title>find-files: decision cost and latency per backend (FAKE)</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:15px;font-weight:600}.st{font-size:12px}.ax{font-size:11px}.lab{font-size:11px}
.g,.a,.guide{stroke-width:1}.guide{stroke-dasharray:4 4}.fake{font-size:13px;font-weight:700}
.bg{fill:#fcfcfb}.dot{stroke:#fcfcfb}text{fill:#0b0b0b}.st,.ax{fill:#52514e}.g{stroke:#e4e3df}.a,.guide{stroke:#a3a29c}.l1{stroke:#2a78d6}.d1{fill:#2a78d6}.fake{fill:#c43534}
